name: Construire l'IPA iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Intégrer les polices (hors connexion)
        run: python3 scripts/embed_fonts.py

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler l'app (sans signature)
        run: |
          xcodebuild \
            -project ChateauDePoche.xcodeproj \
            -scheme ChateauDePoche \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Emballer le fichier .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ChateauDePoche.app Payload/
          zip -qry ChateauDePoche.ipa Payload
          ls -lh ChateauDePoche.ipa

      - name: Mettre l'IPA dans les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ChateauDePoche-ipa
          path: ChateauDePoche.ipa

      - name: Publier une Release avec l'IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Château de poche — build ${{ github.run_number }}
          files: ChateauDePoche.ipa
